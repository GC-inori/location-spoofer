name: Bug 报告
description: 报告 App 功能异常和可复现问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        请按下方占位格式填写诊断报告。可在 App 的「日志」页复制脱敏后的运行日志。
        提交前请移除真实位置、账号、订阅、密码、证书私钥和其他敏感信息。
  - type: textarea
    id: app-report
    attributes:
      label: App 生成的诊断报告
      description: 请按占位格式填写。可从 App「日志」页复制脱敏后的运行日志；如果无法进入 App，请手动补充环境信息。
      placeholder: |
        ### 环境信息
        App 版本:
        系统版本:
        运行模式:
        第三方客户端:
        可复现环境:

        ### 问题描述

        ### 诊断日志
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: 截图或录屏
      description: 可选。请先遮挡账号、通知、真实位置和其他敏感信息。
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issues，确认没有相同问题
          required: true
        - label: 我已移除真实位置、认证信息、订阅地址、证书私钥和其他敏感信息
          required: true
